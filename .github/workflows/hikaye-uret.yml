name: Hikaye ajanı (yapay zekâ görseli üret)

on:
  schedule:
    - cron: "20 5,10,14 * * *"   # Türkiye saatiyle 08:20, 13:20, 17:20 civarı (kuyruk doluysa ajan bekler)
  workflow_dispatch:
    inputs:
      hemen:
        description: "EVET yazarsan üretim kapalı olsa bile bir kez üretir (harcama sınırları yine geçerli)"
        default: "HAYIR"

permissions:
  contents: write

concurrency:
  group: hikaye
  cancel-in-progress: false

jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: numpy (müzik sentezi)
        run: python3 -m pip install --quiet numpy
      - name: Trend tasarımlardan temsili hikaye görselleri üret (yalnızca CC0 / CC BY)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.4-mini' }}
          THINGIVERSE_TOKEN: ${{ secrets.THINGIVERSE_TOKEN }}
          OFIS_ADRES: "https://gurtechs-ajan-ofisi.fly.dev"
          BILDIRIM_SIRRI: ${{ secrets.BILDIRIM_SIRRI }}
          HEMEN: ${{ inputs.hemen }}
        run: |
          if [ "$HEMEN" = "EVET" ]; then
            python3 ajan/hikaye_uret.py --git --hemen
          else
            python3 ajan/hikaye_uret.py --git
          fi
