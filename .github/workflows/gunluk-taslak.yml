name: Günlük içerik taslağı

on:
  schedule:
    - cron: "0 6 * * *"   # her gün 06:00 UTC (09:00 TR)
  workflow_dispatch:       # elle de çalıştırılabilir

permissions:
  contents: write

jobs:
  taslak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hesap durumunu çek (anahtar yoksa atlanır)
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: "17841457188392262"
        run: python3 ajan/istatistik.py
      - name: Taslak üret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.4-mini' }}
        run: python3 ajan/uret.py
      - name: Taslağı depoya kaydet
        run: |
          git config user.name "icerik-ajani"
          git config user.email "icerik-ajani@users.noreply.github.com"
          git add taslaklar ajan/hesap_durumu.md 2>/dev/null || git add taslaklar
          git diff --cached --quiet || git commit -m "Günlük taslak ekle"
          git pull --rebase -q || true
          git push
