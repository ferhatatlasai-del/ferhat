name: Printables servis teşhisi (ücretsiz)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  teshis:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Printables servisinin yapısını yazdır
        run: python3 ajan/printables_teshis.py
