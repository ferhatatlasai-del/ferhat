name: İçerik ajanı (direktifle)

on:
  workflow_dispatch:
    inputs:
      direktif:
        description: "Sahibinin isteği (en fazla 500 karakter)"
        required: true

permissions:
  contents: write

concurrency:
  group: icerik-direktif
  cancel-in-progress: false

jobs:
  taslak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hesap durumunu çek (anahtar yoksa atlanır)
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: "17841457188392262"
        run: python3 ajan/istatistik.py
      - name: Direktifle taslak üret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.4-mini' }}
          DIREKTIF: ${{ inputs.direktif }}
        run: python3 ajan/uret.py --direktif "$DIREKTIF"
      - name: Taslağı depoya kaydet
        run: |
          git config user.name "icerik-ajani"
          git config user.email "icerik-ajani@users.noreply.github.com"
          git add taslaklar ajan/hesap_durumu.md 2>/dev/null || git add taslaklar
          git diff --cached --quiet || git commit -m "Direktifli taslak ekle"
          git pull --rebase -q || true
          git push
