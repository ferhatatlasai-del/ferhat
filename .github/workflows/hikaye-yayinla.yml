name: Hikaye ajanı (yayınla)

on:
  schedule:
    - cron: "5,25,45 5-19 * * *"   # Türkiye saatiyle 08:05-22:45, 20 dakikada bir (GitHub geciktirebilir; asıl zamanlayıcı sunucu)
  workflow_dispatch:
    inputs:
      hemen:
        description: "EVET yazarsan ajan duraklatılmış olsa bile kuyruktaki ilk hikayeyi şimdi yayınlar"
        default: "HAYIR"
      kimlik:
        description: "İsteğe bağlı: yalnızca bu hikaye kimliğini hemen yayınla (panel kullanır)"
        default: ""

permissions:
  contents: write

concurrency:
  group: hikaye
  cancel-in-progress: false

jobs:
  yayinla:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Zamanı geldiyse bir hikaye yayınla
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: "17841457188392262"
          OFIS_ADRES: "https://gurtechs-ajan-ofisi.fly.dev"
          BILDIRIM_SIRRI: ${{ secrets.BILDIRIM_SIRRI }}
          HEMEN: ${{ inputs.hemen }}
          KIMLIK: ${{ inputs.kimlik }}
        run: |
          if [ -n "$KIMLIK" ]; then
            python3 ajan/hikaye.py yayinla --git --kimlik "$KIMLIK"
          elif [ "$HEMEN" = "EVET" ]; then
            python3 ajan/hikaye.py yayinla --git --hemen
          else
            python3 ajan/hikaye.py yayinla --git
          fi
