name: Trend ajanı

on:
  schedule:
    - cron: "30 3 * * 1,4"   # pazartesi ve perşembe 03:30 UTC (GitHub saatlerce geciktirebilir)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trend
  cancel-in-progress: false

jobs:
  trend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trendleri araştır
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.4-mini' }}
          THINGIVERSE_TOKEN: ${{ secrets.THINGIVERSE_TOKEN }}
        run: python3 ajan/trend.py
      - name: Sonucu depoya kaydet
        run: |
          git config user.name "trend-ajani"
          git config user.email "trend-ajani@users.noreply.github.com"
          git add ajan/trendler.json ajan/trendler.md
          git diff --cached --quiet || git commit -m "Trend araştırması güncelle"
          git pull --rebase -q || true
          git push
