name: Carousel'den Shorts videosu üret

on:
  workflow_dispatch:
    inputs:
      taslak:
        description: "Taslak dosyası (boş bırakırsan en yeni taslak). Örn: taslaklar/2026-11-16.md"
        default: ""
      gorsel_uret:
        description: "Görseller yoksa OpenAI ile üretilsin mi? EVET yazarsan görsel başına küçük bir tutar harcanır."
        default: "HAYIR"
      ses:
        description: "Anlatıcı sesi (ash, coral, onyx, nova, sage...)"
        default: "ash"

permissions:
  contents: write

jobs:
  uret:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg ve yazı tipi
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - name: Video üret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TASLAK: ${{ inputs.taslak }}
          GORSEL_URET: ${{ inputs.gorsel_uret }}
          SES: ${{ inputs.ses }}
        run: |
          if [ -z "$TASLAK" ]; then TASLAK="$(ls -1 taslaklar/*.md | sort | tail -1)"; fi
          echo "Taslak: $TASLAK"
          EK=""
          if [ "$GORSEL_URET" = "EVET" ]; then EK="--gorsel-uret"; fi
          python3 ajan/shorts_uret.py --taslak "$TASLAK" --ses "$SES" $EK
      - name: Dosyaları depoya kaydet
        run: |
          git config user.name "shorts-ajani"
          git config user.email "shorts-ajani@users.noreply.github.com"
          git add videolar yayin gorseller 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Shorts videosu üret"
          git pull --rebase -q || true
          git push
