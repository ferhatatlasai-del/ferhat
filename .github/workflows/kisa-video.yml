name: Shorts / Reels üretici (taslak hazırla, yayınlamaz)

on:
  workflow_dispatch:
    inputs:
      hemen:
        description: "EVET yazarsan taslak limiti dolu olsa bile bir kez üretir"
        default: "HAYIR"

permissions:
  contents: write

concurrency:
  group: kisa-video
  cancel-in-progress: false

jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 4 sahneli müzikli kısa video taslağı hazırla
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.4-mini' }}
          OFIS_ADRES: "https://gurtechs-ajan-ofisi.fly.dev"
          BILDIRIM_SIRRI: ${{ secrets.BILDIRIM_SIRRI }}
          HEMEN: ${{ inputs.hemen }}
        run: |
          if [ "$HEMEN" = "EVET" ]; then
            python3 ajan/kisa_video.py --git --hemen
          else
            python3 ajan/kisa_video.py --git
          fi
