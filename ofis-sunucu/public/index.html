<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ajan Ofisi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: sahne solda, seçili ajanın kartı sağda; telefonda alt alta. Ofis 3D, 45 derece açıyla. */
:root{
  --bg:#eef1f5; --panel:#ffffff; --ink:#18212d; --ink2:#556273; --line:#d7dee8;
  --accent:#f07a1a; --ok:#1f9d55; --ready:#2b7de9; --plan:#8a94a3; --star:#f07a1a; --you:#7c5cff;
  --font-head:'Space Grotesk','Inter',system-ui,sans-serif; --font-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
.dir{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.dir label{display:block;font-weight:600;margin-bottom:6px}
textarea,input[type=password]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
textarea{resize:vertical;min-height:72px}
.dsat{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.dsat button,.sab button,#btnAtla{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:13.5px;font-weight:500}
.dsat button.ana{background:var(--accent);border-color:var(--accent);color:#111}
.dsat button:disabled{opacity:.5;cursor:default}
.sab{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sab button{font-size:12.5px;padding:4px 10px;border-radius:999px;color:var(--ink2)}
.dmsg{font-size:12.5px;color:var(--ink2);margin:8px 0 0}
.bub{position:absolute;left:0;top:0;transform:translate(-50%,-100%);max-width:230px;background:var(--panel);color:var(--ink);border:2px solid var(--accent);border-radius:12px;padding:6px 10px;font-size:12.5px;line-height:1.35;box-shadow:0 2px 8px rgba(10,20,40,.2);pointer-events:none;z-index:3}
.bub[hidden]{display:none}
#run{margin-bottom:12px}
.steps{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.steps li{display:flex;gap:8px;align-items:center;color:var(--ink2);font-size:14px}
.steps li i{width:10px;height:10px;border-radius:50%;border:2px solid var(--line);flex:none}
.steps li.done{color:var(--ink)}.steps li.done i{background:var(--ok);border-color:var(--ok)}
.steps li.active{color:var(--ink);font-weight:600}.steps li.active i{border-color:var(--accent);background:var(--accent)}
.steps li.err{color:#d6453d}.steps li.err i{background:#d6453d;border-color:#d6453d}
#stmsg{margin:10px 0 0;font-size:13.5px;color:var(--ink2)}
#sonuc pre{white-space:pre-wrap;word-break:break-word;font:12.5px/1.45 var(--font-body);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;max-height:260px;overflow:auto;margin:10px 0 6px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171f; --panel:#1b222c; --ink:#e8edf4; --ink2:#9aa7b8; --line:#2c3644; --accent:#ff9340;
  --ok:#3cc47a; --ready:#5b9cf5; --plan:#7d889a; --star:#ff9340; --you:#a28cff; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#12171f; --panel:#1b222c; --ink:#e8edf4; --ink2:#9aa7b8; --line:#2c3644; --accent:#ff9340;
  --ok:#3cc47a; --ready:#5b9cf5; --plan:#7d889a; --star:#ff9340; --you:#a28cff; color-scheme:dark;}
*{box-sizing:border-box}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;
  padding-block:20px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto}
header{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
h1{font-family:var(--font-head);font-size:clamp(26px,5vw,36px);line-height:1.1;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{margin:4px 0 0;color:var(--ink2);max-width:52ch}
.next{font-size:13px;color:var(--ink2);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;white-space:nowrap}
.next b{color:var(--ink);font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media (min-width:940px){.grid{grid-template-columns:minmax(0,1fr) 340px;align-items:start}.side{position:sticky;top:12px}}
#view{position:relative;height:clamp(380px,62vh,700px);border-radius:14px;overflow:hidden;border:1px solid var(--line);
  background:radial-gradient(120% 100% at 50% 40%,color-mix(in srgb,var(--panel) 85%,var(--accent) 6%),var(--bg))}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#cv:active{cursor:grabbing}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;transform:translate(-50%,-100%);display:flex;align-items:center;gap:5px;
  background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:999px;
  padding:2px 8px 2px 6px;font-size:11.5px;font-weight:600;white-space:nowrap;pointer-events:auto;cursor:pointer;
  box-shadow:0 1px 4px rgba(10,20,40,.12)}
.lb i{width:8px;height:8px;border-radius:50%;background:var(--plan);flex:none}
.lb.sel{outline:2px solid var(--accent);z-index:2}
@media (max-width:600px){#view{height:360px}.lb{padding:4px}.lb span{display:none}.lb.sel{padding:2px 8px 2px 6px}.lb.sel span{display:inline}.hint{font-size:11px}.next{white-space:normal;border-radius:14px}}
.tools{position:absolute;right:10px;top:10px;display:flex;gap:6px}
button{font:inherit;color:var(--ink);cursor:pointer}
.tools button{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12.5px;font-weight:500}
.hint{position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--ink2);pointer-events:none;
  background:color-mix(in srgb,var(--panel) 80%,transparent);padding:3px 8px;border-radius:8px}
.nogl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--ink2)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:10px 2px 0;font-size:12.5px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h2{font-family:var(--font-head);font-size:20px;margin:0 0 2px;line-height:1.2}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:2px 10px;border-radius:999px;
  border:1px solid currentColor;margin:6px 0 10px}
.pill i{width:8px;height:8px;border-radius:50%;background:currentColor}
dl{margin:0;display:grid;gap:10px}
dt{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:600}
dd{margin:1px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 9px;font-size:13px;
  display:inline-flex;align-items:center;gap:7px}
.chip i{width:9px;height:9px;border-radius:50%}
.chip[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.note{margin-top:12px;font-size:12.5px;color:var(--ink2)}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

</head><body>
<div class="wrap">
  <header>
    <div>
      <h1>Ajan Ofisi</h1>
      <p class="sub">Gür-Techs 3D ekibi çalışma başında. Bir ajana dokun, görevini ve son çalışmasını gör.</p>
    </div>
    <div class="next" id="next">Sonraki otomatik çalışma: <b id="nextT">…</b></div>
  </header>

  <div class="grid">
    <div>
      <div id="view">
        <canvas id="cv" aria-label="Ajanların çalıştığı 3 boyutlu ofis"></canvas>
        <div id="labels"></div>
        <div class="tools"><button id="btnAll" type="button">Tüm ofis</button></div>
        <div class="hint">Sürükle: döndür · İki parmak veya tekerlek: yakınlaştır</div>
      </div>
      <div class="legend" aria-label="Renk anlamları">
        <span><i style="background:var(--ok)"></i>Çalışıyor</span>
        <span><i style="background:var(--ready)"></i>Hazır</span>
        <span><i style="background:var(--plan)"></i>Planlı</span>
        <span><i style="background:var(--star)"></i>Karakter</span>
        <span><i style="background:var(--you)"></i>Sen</span>
      </div>
      <div class="chips" id="chips"></div>
    </div>
    <aside class="side">
      <div class="card" id="run" hidden><h2>İçerik ajanı çalışması</h2><ol class="steps" id="steps"></ol><p id="stmsg"></p><div class="dsat"><button type="button" id="btnAtla" hidden>Anlatmayı atla</button></div><div id="sonuc"></div></div>
      <div class="card" id="info" aria-live="polite"></div>
      <p class="note" id="snap"></p>
    </aside>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
var SNAP='2026-11-16T07:05:00Z';
var DURUM={
  calisiyor:{ad:'Çalışıyor',v:'--ok',c:'#1f9d55'},
  hazir:{ad:'Hazır',v:'--ready',c:'#2b7de9'},
  planli:{ad:'Planlı, henüz kurulmadı',v:'--plan',c:'#8a94a3'},
  karakter:{ad:'Kanalın yüzü',v:'--star',c:'#f07a1a'},
  patron:{ad:'Patron',v:'--you',c:'#7c5cff'}
};
var AJ=[
 {id:'icerik',ad:'İçerik ajanı',kisa:'İçerik',durum:'calisiyor',x:-5,z:-5,yaw:0,tip:'icerik',
  gorev:'Her gün carousel ya da kısa video planı yazar, üç platform için metin hazırlar.',
  son:'2026-11-15T21:45:14Z',sonuc:'Başarılı, günlük taslak yazıldı.',zaman:'Her gün 09:00 (TR). GitHub birkaç dakika geciktirebilir.',not:'Model gpt-5.4-mini, bulunamazsa gpt-4o-mini.'},
 {id:'istatistik',ad:'Hesap istatistik ajanı',kisa:'İstatistik',durum:'calisiyor',x:-0.6,z:-5,yaw:0,tip:'istatistik',
  gorev:'@gurtechs3d takipçi ve son gönderi verisini okur.',
  son:'2026-11-15T18:25:44Z',sonuc:'Veri yazıldı, son doğrulanan çalışma.',zaman:'İçerik ajanıyla aynı iş akışında, her gün 09:00 (TR).',not:'Salt okunur. Beğeni ve yorum gelir, izlenme sayısı gelmez.'},
 {id:'instagram',ad:'Instagram yayın ajanı',kisa:'Instagram',durum:'hazir',x:4,z:-5,yaw:0,tip:'instagram',
  gorev:'Hazır videoyu Reels olarak yayınlar. Onay kapılıdır.',
  son:'2026-11-15T21:56:49Z',sonuc:'Doktor Filament tanıtım videosu yayınlandı.',zaman:'Elle tetiklenir. Onay kutusuna EVET yazılmazsa yalnızca kontrol eder.',not:'Instagram’da yapay zekâ etiketini açıp açamadığı bilinmiyor.'},
 {id:'youtube',ad:'YouTube yayın ajanı',kisa:'YouTube',durum:'hazir',x:8,z:-5,yaw:0,tip:'youtube',
  gorev:'Videoyu YouTube Shorts olarak yükler. Onay kapılıdır.',
  son:'2026-11-16T07:00:05Z',sonuc:'İlk Shorts yüklendi ve herkese açık yayında.',zaman:'Elle tetiklenir. Onay EVET değilse yalnızca bağlantıyı kontrol eder.',not:'Kanal adındaki yazım hatası (DR. FLAMENT) Studio’dan düzeltilecek.'},
 {id:'gorsel',ad:'Görsel ajanı',kisa:'Görsel',durum:'hazir',x:-8,z:-1.5,yaw:Math.PI/2,tip:'gorsel',
  gorev:'OpenAI ile Doktor Filament ana görselini üretir.',
  son:null,sonuc:'Hiç çalıştırılmadı.',zaman:'Elle.',not:'Görseller şimdilik Gemini’de ücretsiz üretiliyor.'},
 {id:'trend',ad:'Trend ajanı',kisa:'Trend',durum:'planli',x:-8,z:2.8,yaw:Math.PI/2,tip:'planli',
  gorev:'YouTube’dan etkileşimi yüksek konuları bulup fikir listesine ekler.',
  son:null,sonuc:'Kurulmadı.',zaman:'Haftada bir olacak.',not:'Benzer hesap listesi ve YouTube API anahtarı gerekir.'},
 {id:'facebook',ad:'Facebook yayın ajanı',kisa:'Facebook',durum:'planli',x:7.6,z:0.2,yaw:0,tip:'planli',
  gorev:'Videoyu Facebook Reels olarak paylaşır.',
  son:null,sonuc:'Kurulmadı.',zaman:'Planlı.',not:'Ayrı kurulum gerekir.'},
 {id:'doktor',ad:'Doktor Filament',kisa:'Dr. Filament',durum:'karakter',x:-1.6,z:0.4,yaw:0,tip:'doktor',
  gorev:'Kanalın yapay zekâ karakteri. Videolarda ve görsellerde yüz olur, 3D baskıyı katman katman anlatır.',
  son:'2026-11-16T07:00:05Z',sonuc:'Tanıtım videosu Instagram ve YouTube’da yayında.',zaman:'Her içerikte sahnede.',not:'Kurgusal, yapay zekâ ile üretilmiş bir karakterdir. Açıklamalarda bu açıkça yazılır.'},
 {id:'sen',ad:'Sen (patron)',kisa:'Sen',durum:'patron',x:3.4,z:3.2,yaw:0,tip:'sen',
  gorev:'Birleştir, yayınla ve yükle kararlarını sen verirsin.',
  son:'2026-11-16T07:00:00Z',sonuc:'Videoyu YouTube’a yüklemeye onay verdin.',zaman:'İstediğin zaman.',not:'Sen onaylamadan hiçbir şey yayınlanmaz.'}
];
var BY={}; AJ.forEach(function(a){BY[a.id]=a;});
var $=function(s){return document.querySelector(s);};
function cssv(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(iso){
  if(!iso) return 'Henüz yok';
  try{return new Intl.DateTimeFormat('tr-TR',{timeZone:'Europe/Istanbul',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'}).format(new Date(iso))+' (TR)';}
  catch(e){return iso;}
}

/* ---------- Kart, çipler, geri sayım ---------- */
var selId=null;
function dot(a){return 'background:var('+DURUM[a.durum].v+')';}
function renderChips(){
  var h='';
  AJ.forEach(function(a){h+='<button type="button" class="chip" data-id="'+a.id+'" aria-pressed="'+(a.id===selId)+'"><i style="'+dot(a)+'"></i>'+a.kisa+'</button>';});
  $('#chips').innerHTML=h;
}
function renderInfo(){
  var a=BY[selId], el=$('#info');
  if(!a){
    el.innerHTML='<h2>Ekip</h2><p style="margin:6px 0 0;color:var(--ink2)">Ofiste 7 ajan, Doktor Filament ve sen varsınız. Beş ajan çalışıyor ya da hazır, ikisi planlı (soluk, boş masalar). Birine dokununca ayrıntısı burada açılır.</p>';
    return;
  }
  var d=DURUM[a.durum];
  el.innerHTML='<h2>'+a.ad+'</h2><span class="pill" style="color:var('+d.v+')"><i></i>'+d.ad+'</span>'+
   '<dl><div><dt>Görev</dt><dd>'+a.gorev+'</dd></div>'+
   '<div><dt>Son çalışma</dt><dd>'+fmt(a.son)+'</dd></div>'+
   '<div><dt>Sonuç</dt><dd>'+a.sonuc+'</dd></div>'+
   '<div><dt>Zamanlama</dt><dd>'+a.zaman+'</dd></div>'+
   '<div><dt>Not</dt><dd>'+a.not+'</dd></div></dl>'+(a.id==='icerik'?direktifFormu():'');
}
function direktifFormu(){
  var sunucu=(typeof MOD!=='undefined'&&MOD==='sunucu'), sifreVar=(typeof SIF!=='undefined'&&SIF);
  return '<div class="dir"><label for="dMetin">Direktif ver</label>'+
   '<textarea id="dMetin" maxlength="500" placeholder="Örn: Bir 3D baskı fenomeni gibi hızlı tempolu, merak uyandıran bir içerik üret."></textarea>'+
   (sunucu&&!sifreVar?'<input id="dSifre" type="password" autocomplete="current-password" placeholder="Ofis şifresi" style="margin-top:8px">':'')+
   '<div class="dsat"><button type="button" id="dMic">Sesle yaz</button><button type="button" id="dGonder" class="ana"'+(typeof busy!=='undefined'&&busy?' disabled':'')+'>'+(sunucu?'Direktifi ver':'Gösteriyi başlat')+'</button></div>'+
   '<div class="sab"><button type="button" data-t="Bir 3D baskı fenomeni gibi hızlı tempolu, merak uyandıran bir içerik üret.">Fenomen tarzı</button><button type="button" data-t="Evde en çok işe yarayan 5 basılabilir nesneyi anlatan bir carousel üret.">Faydalı 5 nesne</button><button type="button" data-t="Doktor Filament’in 3D baskıda sık yapılan bir hatayı esprili şekilde anlattığı kısa bir video planı üret.">Hata ve çözüm</button></div>'+
   '<p class="dmsg" id="dMsg">'+(sunucu?'Direktif GitHub’daki içerik ajanını gerçekten çalıştırır. Hiçbir şey yayınlanmaz, yalnızca taslak yazılır.':'Sunucu bağlı değil: bu bir gösteri. Ajan gerçekten çalışmaz.')+'</p></div>';
}
function select(id,focus){
  selId=id; renderChips(); renderInfo();
  document.querySelectorAll('.lb').forEach(function(l){l.classList.toggle('sel',l.dataset.id===id);});
  if(api.focus) api.focus(id,focus!==false);
}
document.addEventListener('click',function(e){
  var c=e.target.closest&&e.target.closest('.chip,.lb');
  if(c&&c.dataset.id) select(c.dataset.id===selId?null:c.dataset.id);
});
function nextRun(){
  var n=new Date(), t=new Date(Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate(),6,0,0));
  if(t<=n) t=new Date(t.getTime()+864e5);
  var m=Math.round((t-n)/6e4), h=Math.floor(m/60);
  return (h>0?h+' sa ':'')+(m%60)+' dk sonra, 09:00 (TR)';
}
function tickNext(){$('#nextT').textContent=nextRun();}
tickNext(); setInterval(tickNext,30000);
$('#snap').textContent='Bu ofis bir anlık görüntüdür ('+fmt(SNAP)+'). Hareketler ajanın durumunu gösterir, canlı akış değildir.';
var api={};
renderChips(); renderInfo();

/* ---------- 3D ---------- */
var view=$('#view'), cv=$('#cv');
if(typeof THREE==='undefined'){ view.insertAdjacentHTML('beforeend','<div class="nogl">3D kütüphane yüklenemedi. Aşağıdaki listeden ajanları yine de seçebilirsin.</div>'); return; }
var renderer;
try{ renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true}); }
catch(err){ view.insertAdjacentHTML('beforeend','<div class="nogl">Bu cihaz 3D göstermeyi desteklemiyor. Aşağıdaki listeden ajanları yine de seçebilirsin.</div>'); return; }
var still=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
var scene=new THREE.Scene();
var cam=new THREE.OrthographicCamera(-10,10,10,-10,-200,400);
scene.add(new THREE.HemisphereLight(0xffffff,0xaebbd0,0.8));
var sun=new THREE.DirectionalLight(0xffffff,0.7);
sun.position.set(-9,20,13); sun.castShadow=true;
var small=Math.min(window.innerWidth,window.innerHeight)<700;
sun.shadow.mapSize.set(small?1024:2048,small?1024:2048);
sun.shadow.camera.left=-20; sun.shadow.camera.right=20; sun.shadow.camera.top=20; sun.shadow.camera.bottom=-20; sun.shadow.camera.near=1; sun.shadow.camera.far=70;
sun.shadow.bias=-0.0006;
scene.add(sun);

var LM=THREE.MeshLambertMaterial;
function mk(c,ghost,extra){var o={color:c,flatShading:true}; if(ghost){o.transparent=true;o.opacity=0.32;} if(extra){for(var k in extra)o[k]=extra[k];} return new LM(o);}
function shade(m){m.castShadow=true;m.receiveShadow=true;return m;}
function box(w,h,d,m,x,y,z,p){var o=shade(new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m)); o.position.set(x||0,y||0,z||0); if(p)p.add(o); return o;}
function cyl(rt,rb,h,s,m,x,y,z,p){var o=shade(new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,s||8),m)); o.position.set(x||0,y||0,z||0); if(p)p.add(o); return o;}
function ball(r,m,x,y,z,p,det){var o=shade(new THREE.Mesh(new THREE.IcosahedronGeometry(r,det==null?1:det),m)); o.position.set(x||0,y||0,z||0); if(p)p.add(o); return o;}

/* oda */
var room=new THREE.Group(); scene.add(room);
box(20.8,0.5,14.8,mk(0x9fb0c6),0,-0.25,0,room);
for(var i=0;i<10;i++)for(var j=0;j<7;j++){
  var t=box(2,0.04,2,mk((i+j)%2?0xe3e9f1:0xd5dee9),-9+i*2,0.02,-6+j*2,room); t.castShadow=false;
