# Ajan Ofisi: Kalıp Takip uygulamasından TAMAMEN ayrı, bağımsız bir Fly uygulaması.
# Bu dosyayı yalnızca bu klasörden kullan: fly deploy -a gurtechs-ajan-ofisi
app = "gurtechs-ajan-ofisi"
primary_region = "ams"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
