<style>
/* Layout: full-screen canvas platformer; overlay panels centered; touch pad pinned to the bottom corners */
:root {
  --honey: #ffb627;
  --honey-deep: #d97b06;
  --bark: #4a2c17;
  --leaf: #3f9b4a;
  --cream: #fff4dc;
  --ink: #22160c;
  --display: 'Lilita One', 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif;
  --body: 'Nunito', 'Segoe UI', system-ui, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--ink); color: var(--cream); font-family: var(--body); overflow: hidden; user-select: none; -webkit-user-select: none; }
#wrap { position: fixed; inset: 0; display: grid; place-items: center; }
#c { display: block; touch-action: none; image-rendering: auto; box-shadow: 0 0 0 3px var(--bark); }

.panel {
  position: fixed; inset: 0; display: grid; place-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
  background: color-mix(in srgb, var(--ink) 55%, transparent);
}
.card {
  max-width: 30rem; width: 100%; box-sizing: border-box;
  background: var(--cream); color: var(--bark);
  border: 4px solid var(--bark); border-radius: 22px;
  box-shadow: 0 8px 0 var(--bark);
  padding: 22px 22px 24px; display: grid; gap: 12px; text-align: center;
}
.card h1 { font-family: var(--display); font-weight: 400; font-size: clamp(2rem, 7vw, 2.9rem); line-height: 1; margin: 0; color: var(--honey-deep); text-wrap: balance; -webkit-text-stroke: 1.5px var(--bark); paint-order: stroke fill; }
.card h2 { font-family: var(--display); font-weight: 400; font-size: 1.9rem; margin: 0; color: var(--honey-deep); text-wrap: balance; }
.card p { margin: 0; font-size: 1rem; line-height: 1.45; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; text-align: left; font-size: .92rem; margin: 2px auto 0; }
.keys b { font-family: var(--display); font-weight: 400; letter-spacing: .03em; color: var(--honey-deep); }
.btn {
  font-family: var(--display); font-size: 1.35rem; letter-spacing: .04em;
  background: var(--honey); color: var(--bark); border: 3px solid var(--bark); border-radius: 14px;
  padding: 10px 22px; box-shadow: 0 5px 0 var(--bark); cursor: pointer; justify-self: center;
}
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--bark); }
.btn:focus-visible { outline: 3px solid var(--leaf); outline-offset: 3px; }
.small { font-size: .85rem; opacity: .8; }

#touch { position: fixed; inset: auto 0 0 0; display: flex; justify-content: space-between; pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
#touch .grp { display: flex; gap: 12px; align-items: flex-end; }
.tb { pointer-events: auto; width: 68px; height: 68px; border-radius: 50%; border: 3px solid color-mix(in srgb, var(--cream) 80%, transparent);
  background: color-mix(in srgb, var(--bark) 45%, transparent); color: var(--cream); font-family: var(--display); font-size: 1.6rem;
  display: grid; place-items: center; touch-action: none; }
.tb.big { width: 82px; height: 82px; background: color-mix(in srgb, var(--honey-deep) 55%, transparent); }
.tb.on { background: color-mix(in srgb, var(--honey) 70%, transparent); }
#pauseBtn { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
  width: 42px; height: 42px; border-radius: 12px; border: 3px solid var(--bark); background: var(--cream); color: var(--bark);
  font-family: var(--display); font-size: 1.1rem; cursor: pointer; }
@media (prefers-reduced-motion: reduce) { .btn:active { transform: none; } }
</style>

<script>
(() => {
'use strict';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const VW = 960, VH = 540, T = 36, H = 15;

/* ---------- scaling ---------- */
function fit() {
  const s = Math.min(innerWidth / VW, innerHeight / VH);
  cv.style.width = Math.floor(VW * s) + 'px';
  cv.style.height = Math.floor(VH * s) + 'px';
}
addEventListener('resize', fit); fit();

/* ---------- sound ---------- */
let ac = null, muted = false;
function audio() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (ac && ac.state === 'suspended') ac.resume(); }
function tone(f, d = 0.1, type = 'square', to = null, vol = 0.08, delay = 0) {
  if (!ac || muted) return;
  const t0 = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + d);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
  o.connect(g).connect(ac.destination); o.start(t0); o.stop(t0 + d + 0.02);
}
const sfx = {
  jump: () => tone(330, 0.14, 'square', 660, 0.06),
  djump: () => tone(500, 0.16, 'triangle', 1100, 0.08),
  honey: () => { tone(988, 0.07, 'square', null, 0.05); tone(1319, 0.12, 'square', null, 0.05, 0.06); },
  stomp: () => tone(220, 0.15, 'square', 80, 0.09),
  hurt: () => tone(400, 0.3, 'sawtooth', 90, 0.08),
  pound: () => { tone(120, 0.25, 'triangle', 40, 0.18); },
  box: () => tone(660, 0.1, 'triangle', 880, 0.08),
  flag: () => [523, 659, 784].forEach((f, i) => tone(f, 0.15, 'triangle', null, 0.08, i * 0.09)),
  win: () => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, 0.18, 'square', null, 0.06, i * 0.11)),
  life: () => [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.12, 'square', null, 0.06, i * 0.07)),
  die: () => [392, 330, 262, 196].forEach((f, i) => tone(f, 0.2, 'triangle', null, 0.09, i * 0.13)),
};

/* ---------- input ---------- */
const keys = { left: false, right: false, jump: false, down: false };
let jumpPressed = false, downPressed = false;
const map = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', Space: 'jump', ArrowUp: 'jump', KeyW: 'jump', ArrowDown: 'down', KeyS: 'down' };
addEventListener('keydown', e => {
  const k = map[e.code];
  if (k) { e.preventDefault(); if (!keys[k]) { if (k === 'jump') jumpPressed = true; if (k === 'down') downPressed = true; } keys[k] = true; }
  if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
  if (e.code === 'KeyM') muted = !muted;
  if (e.code === 'Enter') { const b = document.querySelector('.panel:not([hidden]) .btn'); if (b) b.click(); }
});
addEventListener('keyup', e => { const k = map[e.code]; if (k) keys[k] = false; });
const isTouch = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
document.querySelectorAll('.tb').forEach(b => {
  const k = b.dataset.k;
  const on = e => { e.preventDefault(); audio(); if (!keys[k]) { if (k === 'jump') jumpPressed = true; if (k === 'down') downPressed = true; } keys[k] = true; b.classList.add('on'); };
  const off = e => { e.preventDefault(); keys[k] = false; b.classList.remove('on'); };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off);
  b.addEventListener('pointercancel', off); b.addEventListener('pointerleave', off);
});

/* ---------- worlds ---------- */
const THEMES = [
  { name: 'Ballı Orman', sky: ['#7fd3ff', '#d9f3ff'], far: '#8fc5a8', mid: '#5aa65e', grass: '#5cc04a', grassDark: '#3f9b37', dirt: '#9a6234', dirtDot: '#7b4a24', tree: 'round', friction: 0.78 },
  { name: 'Gün Batımı Vadisi', sky: ['#ff9a6b', '#ffe0a3'], far: '#c97a7a', mid: '#9c5a6e', grass: '#e3a63a', grassDark: '#b8801f', dirt: '#8c4b3a', dirtDot: '#6d3729', tree: 'cactus', friction: 0.78 },
  { name: 'Karlı Zirve', sky: ['#4b6fae', '#bcd4f0'], far: '#9fb6d6', mid: '#6f8fbf', grass: '#f4f9ff', grassDark: '#c9dcf2', dirt: '#5d6f8c', dirtDot: '#485873', tree: 'pine', friction: 0.93, snow: true },
];

function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// tiles: 0 air, 1 ground, 2 one-way plank, 3 spikes, 4 bonus box, 5 used box, 6 crate
function buildLevel(n) {
  const r = rng(4242 + n * 977);
  const W = 120 + n * 35;
  const g = Array.from({ length: H }, () => new Array(W).fill(0));
  const honey = [], enemies = [];
  let gh = 12, x = 0, checkpoint = null;
  const col = (cx, top) => { for (let y = top; y < H; y++) g[y][cx] = 1; };
  const flat = k => { for (let i = 0; i < k && x < W; i++) col(x++, gh); };
  flat(9);
  const start = { x: 2 * T, y: (gh - 1) * T - 34 };
  while (x < W - 16) {
    const t = r();
    if (!checkpoint && x > W * 0.5) { flat(2); checkpoint = { x: x * T, y: gh * T, on: false }; flat(3); continue; }
    if (t < 0.17) { // pit
      const w = 2 + (r() < 0.35 + n * 0.15 ? 1 : 0);
      for (let i = 0; i < w; i++) honey.push({ x: (x + i) * T + T / 2, y: (gh - 3 - (i === Math.floor(w / 2) ? 1 : 0)) * T + T / 2 });
      x += w; flat(3);
    } else if (t < 0.31) { // step
      const d = (r() < 0.5 ? -1 : 1) * (r() < 0.5 ? 1 : 2);
      gh = Math.max(7, Math.min(12, gh + d)); flat(4 + Math.floor(r() * 3));
    } else if (t < 0.45) { // floating planks
      const len = 3 + Math.floor(r() * 3), py = gh - 4, s = x;
      flat(len);
      for (let i = s; i < s + len; i++) { g[py][i] = 2; honey.push({ x: i * T + T / 2, y: (py - 1) * T + T / 2 }); }
      if (r() < 0.5) enemies.push(mkMush((s + 1) * T, gh * T));
      flat(2);
    } else if (t < 0.58) { // mushroom
      const s = x; flat(6); enemies.push(mkMush((s + 3) * T, gh * T));
      if (n > 0 && r() < 0.4) enemies.push(mkMush((s + 5) * T, gh * T));
    } else if (t < 0.69) { // bee
      const s = x; flat(6); enemies.push(mkBee((s + 3) * T, (gh - 2.6) * T));
    } else if (t < 0.78) { // spikes
      flat(2); const w = 1 + (r() < 0.5 ? 1 : 0);
      for (let i = 0; i < w; i++) { col(x, gh); g[gh - 1][x] = 3; honey.push({ x: x * T + T / 2, y: (gh - 4) * T + T / 2 }); x++; }
      flat(3);
    } else if (t < 0.89) { // bonus box
      const s = x; flat(5); g[gh - 4][s + 2] = 4;
      honey.push({ x: (s + 1) * T + T / 2, y: (gh - 1) * T + T / 2 }, { x: (s + 3) * T + T / 2, y: (gh - 1) * T + T / 2 });
    } else { // crates
      const s = x; flat(5); g[gh - 1][s + 2] = 6;
      if (r() < 0.5) g[gh - 1][s + 3] = 6;
    }
  }
  while (x < W) col(x++, gh);
  const goal = { x: (W - 7) * T, y: gh * T };
  for (let i = 0; i < 4; i++) honey.push({ x: (W - 12 + i) * T + T / 2, y: (gh - 2) * T + T / 2 });
  honey.forEach(h => { h.got = false; h.ph = Math.random() * 6; });
  return { W, g, honey, enemies, start, checkpoint, goal, theme: THEMES[n] };
}
function mkMush(x, groundY) { return { type: 'mush', x, y: groundY - 28, w: 30, h: 28, vx: -1.1, vy: 0, dead: 0, alive: true, t: 0 }; }
function mkBee(x, y) { return { type: 'bee', x, y, bx: x, by: y, w: 30, h: 24, vx: 1.2, dead: 0, alive: true, t: Math.random() * 6 }; }

/* ---------- state ---------- */
let state = 'title', lvlIdx = 0, L = null, P = null, cam = 0, totalHoney = 0, lives = 3, frame = 0, shake = 0, banner = 0;
let parts = [], pops = [], best = 0;
try { best = +localStorage.getItem('pofuduk-best') || 0; } catch (e) {}
const bestLine = document.getElementById('bestLine');
function showBest() { bestLine.textContent = best ? `En iyi bal skorun: ${best}` : 'Mobilde ekrandaki tuşlarla oynayabilirsin.'; }
showBest();

function newPlayer(sx, sy) {
  return { x: sx, y: sy, w: 26, h: 34, vx: 0, vy: 0, face: 1, onGround: false, coyote: 0, buffer: 0, jumps: 0,
    hp: 3, inv: 0, pound: false, dead: 0, anim: 0, squash: 0, spin: 0 };
}
function loadLevel(i, keepHp) {
  lvlIdx = i; L = buildLevel(i);
  const hp = P && keepHp ? P.hp : 3;
  P = newPlayer(L.start.x, L.start.y); P.hp = hp;
  cam = 0; parts = []; pops = []; banner = 150;
}
function respawn() {
  const cp = L.checkpoint && L.checkpoint.on ? L.checkpoint : null;
  P = cp ? newPlayer(cp.x, cp.y - 40) : newPlayer(L.start.x, L.start.y);
  P.inv = 90;
  L.enemies.forEach(e => { if (!e.alive) return; });
}

/* ---------- tile helpers ---------- */
const tileAt = (tx, ty) => (ty < 0 || ty >= H || tx < 0 || tx >= L.W) ? (tx < 0 || tx >= L.W ? 1 : 0) : L.g[ty][tx];
const solid = t => t === 1 || t === 4 || t === 5 || t === 6;

function moveX(o) {
  o.x += o.vx; o.hitWall = false;
  const top = Math.floor(o.y / T), bot = Math.floor((o.y + o.h - 0.01) / T);
  if (o.vx > 0) {
    const tx = Math.floor((o.x + o.w - 0.01) / T);
    for (let ty = top; ty <= bot; ty++) if (solid(tileAt(tx, ty))) { o.x = tx * T - o.w; o.vx = 0; o.hitWall = true; break; }
  } else if (o.vx < 0) {
    const tx = Math.floor(o.x / T);
    for (let ty = top; ty <= bot; ty++) if (solid(tileAt(tx, ty))) { o.x = (tx + 1) * T; o.vx = 0; o.hitWall = true; break; }
  }
}
function moveY(o) {
  const prevBot = o.y + o.h;
  o.y += o.vy; o.onGround = false; o.landTiles = null; o.headTiles = null;
  const l = Math.floor(o.x / T), rr = Math.floor((o.x + o.w - 0.01) / T);
  if (o.vy > 0) {
    const ty = Math.floor((o.y + o.h - 0.01) / T);
    for (let tx = l; tx <= rr; tx++) {
      const t = tileAt(tx, ty);
      if (solid(t) || (t === 2 && prevBot <= ty * T + 0.5)) {
        o.y = ty * T - o.h; o.vy = 0; o.onGround = true;
        o.landTiles = []; for (let k = l; k <= rr; k++) o.landTiles.push([k, ty]);
        break;
      }
    }
  } else if (o.vy < 0) {
    const ty = Math.floor(o.y / T);
    for (let tx = l; tx <= rr; tx++) if (solid(tileAt(tx, ty))) {
      o.y = (ty + 1) * T; o.vy = 0; o.headTiles = []; for (let k = l; k <= rr; k++) o.headTiles.push([k, ty]); break;
    }
  }
}

/* ---------- effects ---------- */
function burst(x, y, color, n = 10, sp = 4, grav = 0.25) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = Math.random() * sp;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1.5, life: 30 + Math.random() * 20, color, r: 2 + Math.random() * 3, grav });
  }
}
function addHoney(n, x, y) {
  for (let i = 0; i < n; i++) {
    totalHoney++;
    if (totalHoney % 50 === 0) { lives++; sfx.life(); pops.push({ x, y: y - 20, txt: '+1 CAN', life: 70 }); }
  }
  if (x !== undefined) pops.push({ x, y, txt: '+' + n, life: 40 });
}

/* ---------- update ---------- */
function hurt(knock) {
  if (P.inv > 0 || P.dead) return;
  P.hp--; P.inv = 100; shake = 10; sfx.hurt();
  P.vy = -7; P.vx = knock * 5; P.pound = false;
  burst(P.x + P.w / 2, P.y + P.h / 2, '#ff5a4f', 12);
  if (P.hp <= 0) kill();
}
function kill() {
  if (P.dead) return;
  P.dead = 1; P.vy = -11; P.vx = 0; sfx.die(); shake = 14;
}

function update() {
  frame++;
  if (banner > 0) banner--;
  if (shake > 0) shake--;
  parts.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += p.grav; p.life--; });
  parts = parts.filter(p => p.life > 0);
  pops.forEach(p => { p.y -= 0.8; p.life--; });
  pops = pops.filter(p => p.life > 0);
  if (L.theme.snow && frame % 3 === 0) parts.push({ x: cam + Math.random() * VW, y: -5, vx: -0.4 + Math.random() * 0.3, vy: 1 + Math.random(), life: 600, color: '#ffffff', r: 1.5 + Math.random() * 1.5, grav: 0, snow: true });

  if (P.dead) {
    P.dead++; P.vy += 0.5; P.y += P.vy;
    if (P.dead > 100) {
      lives--;
      if (lives <= 0) return gameOver();
      respawn();
    }
    jumpPressed = downPressed = false;
    return;
  }

  // horizontal control
  const fr = L.theme.friction;
  const acc = P.onGround ? (fr > 0.9 ? 0.32 : 0.7) : 0.45, max = 4.8;
  if (!P.pound) {
    if (keys.left && !keys.right) { P.vx = Math.max(-max, P.vx - acc); P.face = -1; }
    else if (keys.right && !keys.left) { P.vx = Math.min(max, P.vx + acc); P.face = 1; }
    else P.vx *= P.onGround ? fr : 0.92;
    if (Math.abs(P.vx) < 0.05) P.vx = 0;
  }

  // jumping
  if (P.onGround) { P.coyote = 7; P.jumps = 0; } else if (P.coyote > 0) P.coyote--;
  if (jumpPressed) P.buffer = 7; else if (P.buffer > 0) P.buffer--;
  if (P.buffer > 0 && !P.pound) {
    if (P.coyote > 0) { P.vy = -12.6; P.coyote = 0; P.buffer = 0; P.jumps = 1; P.squash = -6; sfx.jump(); burst(P.x + P.w / 2, P.y + P.h, '#ffffffaa', 6, 2, 0.05); }
    else if (P.jumps < 2) { P.vy = -10.8; P.buffer = 0; P.jumps = 2; P.spin = 22; sfx.djump(); burst(P.x + P.w / 2, P.y + P.h, '#ffd76a', 10, 3, 0.05); }
  }
  if (!keys.jump && P.vy < -4 && !P.spin) P.vy = -4;
  if (downPressed && !P.onGround && !P.pound) { P.pound = true; P.vx = 0; P.vy = -3; P.spin = 0; }
  jumpPressed = downPressed = false;

  P.vy += P.pound ? 0.9 : 0.6;
  P.vy = Math.min(P.vy, P.pound ? 16 : 13);
  if (P.spin > 0) P.spin--;

  moveX(P);
  const vyBefore = P.vy;
  moveY(P);

  // bonus boxes from below
  if (P.headTiles) for (const [tx, ty] of P.headTiles) {
    if (L.g[ty][tx] === 4) { L.g[ty][tx] = 5; sfx.box(); addHoney(5, tx * T + T / 2, ty * T - 10); burst(tx * T + T / 2, ty * T, '#ffb627', 14); break; }
  }
  // landing
  if (P.onGround && vyBefore > 3) P.squash = Math.min(8, vyBefore * 0.6);
  if (P.onGround && P.pound) {
    P.pound = false; shake = 12; sfx.pound();
    burst(P.x + P.w / 2, P.y + P.h, '#c9a27a', 18, 5);
    for (const [tx, ty] of P.landTiles || []) {
      if (L.g[ty][tx] === 6) { L.g[ty][tx] = 0; addHoney(3, tx * T + T / 2, ty * T); burst(tx * T + T / 2, ty * T + T / 2, '#a8743d', 16, 5); P.vy = -6; P.onGround = false; }
    }

let msgAction = null;
function showMsg(title, text, btn, act) { msgTitle.textContent = title; msgText.textContent = text; msgBtn.textContent = btn; msgAction = act; pMsg.hidden = false; touchUi.hidden = true; pauseBtn.hidden = true; setTimeout(() => msgBtn.focus(), 50); }
function setPlaying() { state = 'play'; pMsg.hidden = true; pTitle.hidden = true; touchUi.hidden = !isTouch; pauseBtn.hidden = false; }
msgBtn.onclick = () => { audio(); if (msgAction) msgAction(); };
document.getElementById('startBtn').onclick = () => { audio(); totalHoney = 0; lives = 3; P = null; loadLevel(0); setPlaying(); };
pauseBtn.onclick = () => togglePause();
function togglePause() { if (state === 'play') state = 'pause'; else if (state === 'pause') state = 'play'; pauseBtn.textContent = state === 'pause' ? '▶' : 'II'; }
function saveBest() { if (totalHoney > best) { best = totalHoney; try { localStorage.setItem('pofuduk-best', best); } catch (e) {} } showBest(); }
function levelDone() {
  sfx.win(); state = 'done';
  const got = L.honey.filter(h => h.got).length, all = L.honey.length;
  if (lvlIdx >= 2) {
    saveBest();
    showMsg('Bal kulübesi dolu!', `Pofuduk üç bölgeyi de geçti ve toplam ${totalHoney} bal topladı. Afiyet olsun!`, 'Baştan oyna', () => { totalHoney = 0; lives = 3; P = null; loadLevel(0); setPlaying(); });
  } else {
    showMsg(`${L.theme.name} tamam!`, `Bu bölgede ${all} kavanozun ${got} tanesini buldun. Sıradaki durak: ${THEMES[lvlIdx + 1].name}.`, 'Devam et', () => { loadLevel(lvlIdx + 1, true); P.hp = 3; setPlaying(); });
  }
}
function gameOver() {
  state = 'over'; saveBest();
  showMsg('Pofuduk yoruldu', `${totalHoney} bal topladın. Biraz bal yiyip yeniden denemeye ne dersin?`, 'Tekrar dene', () => { totalHoney = 0; lives = 3; P = null; loadLevel(0); setPlaying(); });
}

/* ---------- loop ---------- */
loadLevel(0);
let last = performance.now(), accum = 0, demoT = 0;
function loop(now) {
  accum += Math.min(100, now - last); last = now;
  while (accum >= 1000 / 60) {
    if (state === 'play') update();
    else if (state === 'title') { // attract mode: bear strolls
      demoT++; frame++; P.vx = 2.2; P.face = 1; P.anim += 0.26; P.x += P.vx; P.y = L.start.y;
      P.onGround = true; if (P.x > 7 * T) P.x = L.start.x;
      cam = Math.max(0, P.x - VW * 0.42);
    }
    accum -= 1000 / 60;
  }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

window.claude?.hot?.snapshot?.(() => ({ lvlIdx, totalHoney, lives }));
})();
</script>
